version: '3.8'

services:
  meu_progresso_frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: scsi_meu_progresso
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      # TODO: Substitua 'progresso.seudominio.com.br' pelo seu domínio real
      - "traefik.http.routers.meuprogresso.rule=Host(`progresso.seudominio.com.br`)"
      - "traefik.http.routers.meuprogresso.entrypoints=websecure"
      - "traefik.http.routers.meuprogresso.tls.certresolver=letsencrypt" # Certifique-se de que o nome do resolver é 'letsencrypt' no seu Traefik
      - "traefik.http.services.meuprogresso.loadbalancer.server.port=80"

networks:
  traefik_network:
    external: true
