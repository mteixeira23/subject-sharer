version: '3.8'

services:
  meu_progresso_frontend:
    image: scsi_meu_progresso:latest
    build: 
      context: .
      dockerfile: Dockerfile
    networks:
      - scsi_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.meuprogresso.rule=Host(`habitus.singulariconsult.com.br`)"
        - "traefik.http.routers.meuprogresso.entrypoints=websecure"
        - "traefik.http.routers.meuprogresso.tls=true"
        - "traefik.http.services.meuprogresso.loadbalancer.server.port=80"

networks:
  scsi_public:
    external: true
