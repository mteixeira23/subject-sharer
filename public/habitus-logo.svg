<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 580" width="512" height="580" fill="none">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clock circle outer -->
  <circle cx="256" cy="256" r="180" stroke="#00E5CC" stroke-width="4" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Clock circle inner ring -->
  <circle cx="256" cy="256" r="168" stroke="#00E5CC" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Hour markers -->
  <!-- 12 -->
  <line x1="256" y1="86" x2="256" y2="108" stroke="#00E5CC" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- 3 -->
  <line x1="426" y1="256" x2="404" y2="256" stroke="#00E5CC" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- 6 -->
  <line x1="256" y1="426" x2="256" y2="404" stroke="#00E5CC" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- 9 -->
  <line x1="86" y1="256" x2="108" y2="256" stroke="#00E5CC" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Minor hour markers -->
  <!-- 1 -->
  <line x1="341" y1="111" x2="332" y2="127" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 2 -->
  <line x1="401" y1="171" x2="385" y2="180" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 4 -->
  <line x1="401" y1="341" x2="385" y2="332" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 5 -->
  <line x1="341" y1="401" x2="332" y2="385" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 7 -->
  <line x1="171" y1="401" x2="180" y2="385" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 8 -->
  <line x1="111" y1="341" x2="127" y2="332" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 10 -->
  <line x1="111" y1="171" x2="127" y2="180" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- 11 -->
  <line x1="171" y1="111" x2="180" y2="127" stroke="#00E5CC" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Hour hand (pointing ~10:10 position) -->
  <line x1="256" y1="256" x2="210" y2="160" stroke="#00E5CC" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Minute hand -->
  <line x1="256" y1="256" x2="330" y2="170" stroke="#00E5CC" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="8" fill="#00E5CC" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="4" fill="#001a18"/>

  <!-- Habitus text -->
  <text x="256" y="520" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="8" fill="#00E5CC" filter="url(#textGlow)">HABITUS</text>
</svg>