<!doctype html>
<html lang="pt-BR" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (window.location.search.includes('reset=1') || window.location.search.includes('clear=1')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          try { localStorage.clear(); sessionStorage.clear(); } catch(e) {}
          window.location.replace(window.location.origin + window.location.pathname);
          return;
        }

        const theme = localStorage.getItem('theme') || 'dark';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Habitus</title>
    <meta name="description" content="Seu app pessoal de produtividade: estudos, finanças, tarefas, saúde e mais." />
    <meta name="author" content="Habitus" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <meta property="og:title" content="Habitus" />
    <meta property="og:description" content="Seu app pessoal de produtividade: estudos, finanças, tarefas, saúde e mais." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
